<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>KH AI - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#e0e0e0;font-family:monospace;overflow:hidden}

/* CONTAINER */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

/* LOGIN BOX */
.login-box{width:100%;max-width:380px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;padding:32px 24px;box-shadow:0 0 40px rgba(255,0,51,.05)}

/* LOGO */
.logo-wrap{display:flex;justify-content:center;margin-bottom:20px}
.logo-wrap svg{width:60px;height:60px}

/* TEXT */
h1{color:#fff;font-size:20px;letter-spacing:.15em;text-align:center;margin-bottom:6px;font-weight:800}
h1 span{color:#ff0033}
.subtitle{color:#909090;font-size:11px;text-align:center;margin-bottom:28px;letter-spacing:.1em}

/* BUTTONS */
button{width:100%;padding:14px;border-radius:10px;font-family:monospace;font-size:13px;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:.2s;border:0;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-google{background:#fff;color:#000}
.btn-google:hover{background:#e0e0e0}
.btn-google svg{width:18px;height:18px}
.btn-email{background:#ff0033;color:#000;box-shadow:0 0 18px rgba(255,0,51,.35)}
.btn-email:hover{box-shadow:0 0 28px rgba(255,0,51,.6)}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#4a4a4a;font-size:10px;letter-spacing:.2em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#1a1a1a}

/* INPUTS */
input{width:100%;padding:14px 16px;background:#050505;border:1px solid #222;border-radius:10px;color:#e8e8e8;font-family:monospace;font-size:14px;outline:none;margin-bottom:12px;transition:.2s}
input:focus{border-color:#ff0033;box-shadow:0 0 0 3px rgba(255,0,51,.1)}

/* TOGGLE TEXT */
.toggle-text{text-align:center;font-size:12px;color:#909090;margin-top:16px}
.toggle-text a{color:#ff0033;text-decoration:none;cursor:pointer;font-weight:700}
.toggle-text a:hover{text-decoration:underline}

/* MESSAGE */
.msg{text-align:center;font-size:12px;margin-top:14px;min-height:18px;color:#ff0033;font-weight:bold}

/* FOOTER */
.footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:10px;color:#4a4a4a;letter-spacing:.1em;z-index:2}
</style>
</head>
<body>

<div id="app">
  <div class="login-box">
    <!-- LOGO SVG MANUAL -->
    <div class="logo-wrap">
      <svg viewBox="0 0 40 40">
        <path d="M20 3 L35 11 L35 27 L20 35 L5 27 L5 11 Z" fill="none" stroke="#ff0033" stroke-width="2"/>
        <path d="M20 10 L20 30 M12 15 L28 25 M28 15 L12 25" stroke="#ff0033" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="#ff0033"/>
      </svg>
    </div>
    
    <h1>KH <span>AI</span></h1>
    <div class="subtitle" id="formTitle">MASUK KE AKUNMU</div>

    <!-- LOGIN GOOGLE -->
    <button class="btn-google" id="googleBtn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      LANJUTKAN DENGAN GOOGLE
    </button>

    <div class="divider">ATAU</div>

    <!-- LOGIN EMAIL -->
    <input type="email" id="email" placeholder="Alamat Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-email" id="emailBtn">MASUK DENGAN EMAIL</button>

    <!-- TOGGLE DAFTAR -->
    <div class="toggle-text" id="toggleText">
      Belum punya akun? <a id="toggleBtn">Daftar di sini</a>
    </div>
    
    <!-- PESAN ERROR/SUKSES -->
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="footer">KH STUDIO &copy; 2026</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const FIREBASE_CONFIG={apiKey:"AIzaSyAPx6XY8CRDrS8sxh00uNjWsymTu8jD95M",authDomain:"khai-b6e18.firebaseapp.com",projectId:"khai-b6e18",storageBucket:"khai-b6e18.firebasestorage.app",messagingSenderId:"903942429337",appId:"1:903942429337:web:9a21b3b38c7bc917be3608"};
const fbApp=initializeApp(FIREBASE_CONFIG),auth=getAuth(fbApp);
const provider=new GoogleAuthProvider();

let isRegisterMode=false;
const msgEl=document.getElementById("msg");
const formTitle=document.getElementById("formTitle");
const toggleBtn=document.getElementById("toggleBtn");
const toggleText=document.getElementById("toggleText");
const emailBtn=document.getElementById("emailBtn");

// FUNGSI PESAN
function showMsg(text,isError=true){
  msgEl.textContent=text;
  msgEl.style.color=isError?"#ff0033":"#00aa55";
}

// TOGGLE LOGIN/DAFTAR
function setupToggle(){
  document.getElementById("toggleBtn").onclick=function(){
    isRegisterMode=!isRegisterMode;
    if(isRegisterMode){
      formTitle.textContent="BUAT AKUN BARU";
      emailBtn.textContent="DAFTAR DENGAN EMAIL";
      toggleText.innerHTML='Sudah punya akun? <a id="toggleBtn">Login di sini</a>';
    }else{
      formTitle.textContent="MASUK KE AKUNMU";
      emailBtn.textContent="MASUK DENGAN EMAIL";
      toggleText.innerHTML='Belum punya akun? <a id="toggleBtn">Daftar di sini</a>';
    }
    setupToggle(); // Re-bind event
    showMsg("",false);
  };
}
setupToggle();

// LOGIN GOOGLE
document.getElementById("googleBtn").onclick=async function(){
  this.disabled=true;
  showMsg("Menghubungkan ke Google...",false);
  try{
    await signInWithPopup(auth,provider);
  }catch(e){
    showMsg("Gagal login Google: "+e.message);
    this.disabled=false;
  }
};

// LOGIN/Daftar EMAIL
emailBtn.onclick=async function(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  
  if(!email||!password){showMsg("Email dan password wajib diisi.");return;}
  if(password.length<6){showMsg("Password minimal 6 karakter.");return;}
  
  this.disabled=true;
  showMsg("Memproses...",false);
  
  try{
    if(isRegisterMode){
      await createUserWithEmailAndPassword(auth,email,password);
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
  }catch(e){
    let errMsg=e.message;
    if(errMsg.includes("auth/invalid-credential"))errMsg="Email atau password salah.";
    if(errMsg.includes("auth/email-already-in-use"))errMsg="Email ini sudah terdaftar. Coba login.";
    if(errMsg.includes("auth/weak-password"))errMsg="Password terlalu lemah (minimal 6 karakter).";
    if(errMsg.includes("auth/invalid-email"))errMsg="Format email tidak valid.";
    showMsg(errMsg);
    this.disabled=false;
  }
};

// CEK STATUS LOGIN
onAuthStateChanged(auth,(user)=>{
  if(user){
    showMsg("Berhasil! Mengalihkan ke chat...",false);
    setTimeout(()=>{window.location.href="chat.html";},800);
  }
});
</script>
</body>
</html>
